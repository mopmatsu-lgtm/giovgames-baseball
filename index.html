<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>giovgames - ゲームポータル</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background-color: var(--bg-color); color: var(--text-main); line-height: 1.6; }
    header { background-color: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); border-bottom: 1px solid #334155; padding: 16px 24px; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-size: 1.4rem; font-weight: 800; letter-spacing: 0.05em; color: var(--accent); text-decoration: none; }
    .nav-links a { color: var(--text-sub); text-decoration: none; margin-left: 20px; font-size: 0.9rem; transition: color 0.2s; }
    .nav-links a:hover { color: var(--text-main); }
    .container { max-width: 1100px; margin: 0 auto; padding: 32px 20px; }
    .hero { background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); border: 1px solid #334155; border-radius: 16px; padding: 40px 32px; margin-bottom: 48px; display: flex; flex-direction: column; align-items: flex-start; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3); }
    .badge { background-color: var(--accent); color: #0f172a; font-size: 0.75rem; font-weight: 800; padding: 4px 10px; border-radius: 999px; margin-bottom: 12px; }
    .hero h1 { font-size: 2rem; margin-bottom: 12px; }
    .hero p { color: var(--text-sub); max-width: 600px; margin-bottom: 24px; }
    .btn-primary { display: inline-block; background-color: var(--accent); color: #0f172a; font-weight: 700; padding: 12px 28px; border-radius: 8px; text-decoration: none; transition: background-color 0.2s, transform 0.1s; }
    .btn-primary:hover { background-color: var(--accent-hover); color: #fff; transform: translateY(-2px); }
    .section-title { font-size: 1.3rem; margin-bottom: 20px; padding-left: 12px; border-left: 4px solid var(--accent); }
    .game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
    .game-card { background-color: var(--card-bg); border: 1px solid #334155; border-radius: 12px; overflow: hidden; transition: transform 0.2s, border-color 0.2s; display: flex; flex-direction: column; }
    .game-card:hover { transform: translateY(-4px); border-color: var(--accent); }
    .thumbnail { height: 160px; background: linear-gradient(45deg, #10b981, #059669); display: flex; align-items: center; justify-content: center; font-size: 3rem; }
    .card-body { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
    .genre { font-size: 0.75rem; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
    .card-title { font-size: 1.15rem; margin-bottom: 8px; }
    .card-desc { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 20px; flex-grow: 1; }
    .btn-play { display: block; text-align: center; background-color: #334155; color: var(--text-main); padding: 10px; border-radius: 6px; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: background-color 0.2s; }
    .btn-play:hover { background-color: var(--accent); color: #0f172a; }
    footer { text-align: center; padding: 40px 20px; margin-top: 60px; border-top: 1px solid #1e293b; color: var(--text-sub); font-size: 0.85rem; }
    @media (max-width: 600px) { header { padding: 14px 16px; } .nav-links a { margin-left: 12px; } .container { padding: 24px 16px; } .hero { padding: 32px 24px; } }
  </style>
</head>
<body>
  <header>
    <a href="/" class="logo">giovgames</a>
    <nav class="nav-links" aria-label="メインナビゲーション">
      <a href="#games">ゲーム一覧</a>
      <a href="#about">サイトについて</a>
    </nav>
  </header>

  <main class="container">
    <section class="hero" aria-labelledby="featured-game-title">
      <span class="badge">PICK UP / 公開中</span>
      <h1 id="featured-game-title">ベースボールweb</h1>
      <p>球団を育ててリーグを勝ち抜こう。ブラウザですぐに遊べる野球シミュレーションゲームです。</p>
      <a href="game.html" class="btn-primary">▶ ベースボールwebをプレイ</a>
    </section>

    <section aria-labelledby="games">
      <h2 id="games" class="section-title">公開中のゲーム</h2>
      <div class="game-grid">
        <article class="game-card">
          <div class="thumbnail" aria-hidden="true">⚾</div>
          <div class="card-body">
            <span class="genre">野球 / 球団育成シミュレーション</span>
            <h3 class="card-title">ベースボールweb</h3>
            <p class="card-desc">オーダーを編成し、球団を育成してペナントを戦おう。</p>
            <a href="game.html" class="btn-play">ゲームを始める</a>
          </div>
        </article>
      </div>
    </section>
  </main>

  <footer id="about">
    <p>&copy; 2026 giovgames. All Rights Reserved.</p>
  </footer>
</body>
</html>
